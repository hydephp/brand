  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ze:44px;font-weight:700;letter-spacing:-0.03em;line-height:1.05;\">Wordmark &amp; lockup guide<\u002Fdiv>\n  <div style=\"font-size:16px;line-height:1.65;color:#4a4a58;max-width:660px;text-wrap:pretty;\">Two approved typographic systems. <strong>Editorial<\u002Fstrong> for the Victorian site, <strong>Grotesk<\u002Fstrong> for the current site and HydePHP Cloud. The hat is constant across both — it carries recognition, so the wordmark can be swapped without breaking the brand.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:40px 0 56px;border-bottom:1px solid #e4e4ea;\">\n  <div style=\"display:flex;flex-direction:column;gap:14px;padding:26px;border:1px solid #dcdce4;border-radius:6px;\">\n    <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">System A<\u002Fdiv>\n    <div style=\"font-family:'Playfair Display',serif;font-size:38px;font-weight:700;letter-spacing:-0.01em;line-height:1;\">Editorial<\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.6;color:#4a4a58;\">Playfair Display. The Victorian-themed site, print, and anything that wants period character. Open source project only — never Cloud.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px;padding:26px;border:1px solid #dcdce4;border-radius:6px;\">\n    <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">System B<\u002Fdiv>\n    <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:38px;font-weight:700;letter-spacing:-0.035em;line-height:1;\">Grotesk<\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.6;color:#4a4a58;\">Schibsted Grotesk, Hyde and PHP at equal weight. Current site, HydePHP Cloud, GitHub, docs, product UI.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- SYSTEM A -->\n<div style=\"display:flex;flex-direction:column;gap:36px;padding:56px 0;border-bottom:1px solid #e4e4ea;\">\n  <div style=\"display:flex;align-items:baseline;gap:16px;\">\n    <div style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em;\">System A — Editorial<\u002Fdiv>\n    <div style=\"font-size:13px;color:#8a8a99;\">Playfair Display · SIL Open Font License<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#141e30;border-radius:6px;padding:64px 56px;display:flex;flex-direction:column;gap:52px;\">\n    <div style=\"display:flex;align-items:center;gap:3.3px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:118.5px;height:118.5px;display:block;flex:none;\">\n      <div style=\"font-family:'Playfair Display',serif;font-size:72px;line-height:0.95;font-weight:700;letter-spacing:-0.01em;color:#ffffff;\">HydePHP<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:#2b3a55;\"><\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.6;color:#8fa0bd;max-width:520px;\">No Cloud lockup in this system. HydePHP Cloud is always System B.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#f4f4f8;border-radius:6px;padding:44px 56px;display:flex;align-items:center;gap:64px;flex-wrap:wrap;\">\n    <div style=\"display:flex;align-items:center;gap:1.5px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:56px;height:56px;display:block;flex:none;\">\n      <div style=\"font-family:'Playfair Display',serif;font-size:34px;line-height:0.95;font-weight:700;letter-spacing:-0.01em;color:#141e30;\">HydePHP<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:1px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:37.9px;height:37.9px;display:block;flex:none;\">\n      <div style=\"font-family:'Playfair Display',serif;font-size:23px;line-height:0.95;font-weight:700;letter-spacing:-0.01em;color:#141e30;\">HydePHP<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:0px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:41px;height:41px;display:block;\">\n      <div style=\"font-family:'Playfair Display',serif;font-size:25px;line-height:0.95;font-weight:700;letter-spacing:-0.01em;color:#141e30;\">HydePHP<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e4ea;border:1px solid #e4e4ea;border-radius:6px;overflow:hidden;\">\n    <div style=\"background:#fff;padding:20px 22px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">Wordmark<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">Playfair Display Bold<\u002Fdiv><div style=\"font-size:13px;color:#6b6b7a;\">700 · tracking −0.01em<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;padding:20px 22px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">“Cloud”<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">Not available<\u002Fdiv><div style=\"font-size:13px;color:#6b6b7a;\">HydePHP Cloud is always System B<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;padding:20px 22px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">Hat scale<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">1.55 × cap height<\u002Fdiv><div style=\"font-size:13px;color:#6b6b7a;\">visible hat, brim to crown<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;padding:20px 22px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">Minimum<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">20px wordmark<\u002Fdiv><div style=\"font-size:13px;color:#6b6b7a;\">hairlines break below this<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- SYSTEM B -->\n<div style=\"display:flex;flex-direction:column;gap:36px;padding:56px 0;border-bottom:1px solid #e4e4ea;\">\n  <div style=\"display:flex;align-items:baseline;gap:16px;\">\n    <div style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em;\">System B — Grotesk<\u002Fdiv>\n    <div style=\"font-size:13px;color:#8a8a99;\">Schibsted Grotesk · SIL Open Font License<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#141e30;border-radius:6px;padding:64px 56px;display:flex;flex-direction:column;gap:52px;\">\n    <div style=\"display:flex;align-items:center;gap:3.2px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:117.7px;height:117.7px;display:block;flex:none;\">\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:72px;line-height:0.9;font-weight:700;letter-spacing:-0.035em;color:#ffffff;\">HydePHP<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:#2b3a55;\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:2.3px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:85px;height:85px;display:block;flex:none;\">\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:52px;line-height:0.9;font-weight:700;letter-spacing:-0.035em;color:#ffffff;\">HydePHP <span style=\"font-weight:400;color:#c3ccdc;letter-spacing:-0.02em;\">Cloud<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#f4f4f8;border-radius:6px;padding:44px 56px;display:flex;align-items:center;gap:64px;flex-wrap:wrap;\">\n    <div style=\"display:flex;align-items:center;gap:1.5px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:55.6px;height:55.6px;display:block;flex:none;\">\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:34px;line-height:0.9;font-weight:700;letter-spacing:-0.035em;color:#141e30;\">HydePHP<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:1px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:37.6px;height:37.6px;display:block;flex:none;\">\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:23px;line-height:0.9;font-weight:700;letter-spacing:-0.035em;color:#141e30;\">HydePHP<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:0.7px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:26.2px;height:26.2px;display:block;flex:none;\">\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:16px;line-height:0.9;font-weight:700;letter-spacing:-0.03em;color:#141e30;\">HydePHP<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:0px;\">\n      <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:40.9px;height:40.9px;display:block;\">\n      <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:25px;line-height:0.9;font-weight:700;letter-spacing:-0.035em;color:#141e30;\">HydePHP<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e4e4ea;border:1px solid #e4e4ea;border-radius:6px;overflow:hidden;\">\n    <div style=\"background:#fff;padding:20px 22px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">Wordmark<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">Schibsted Grotesk Bold<\u002Fdiv><div style=\"font-size:13px;color:#6b6b7a;\">700 throughout · tracking −0.035em<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;padding:20px 22px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">“Cloud”<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">Schibsted Grotesk Regular<\u002Fdiv><div style=\"font-size:13px;color:#6b6b7a;\">400 · tracking −0.02em · same size<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;padding:20px 22px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">Hat scale<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">1.55 × cap height<\u002Fdiv><div style=\"font-size:13px;color:#6b6b7a;\">visible hat, brim to crown<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;padding:20px 22px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a99;font-weight:600;\">Minimum<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">14px wordmark<\u002Fdiv><div style=\"font-size:13px;color:#6b6b7a;\">holds in a docs sidebar<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- CONSTRUCTION -->\n<div style=\"display:flex;flex-direction:column;gap:28px;padding:56px 0;border-bottom:1px solid #e4e4ea;\">\n  <div style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em;\">Construction<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:start;\">\n    <div style=\"position:relative;min-width:0;background:#f4f4f8;border-radius:6px;padding:44px 32px;display:flex;align-items:center;justify-content:center;\">\n      <div style=\"position:relative;display:flex;align-items:center;gap:1.8px;padding:28px;outline:1px dashed #b9b9c6;\">\n        <div style=\"position:absolute;left:0;top:0;bottom:0;width:28px;background:rgba(233,64,87,0.10);\"><\u002Fdiv>\n        <div style=\"position:absolute;right:0;top:0;bottom:0;width:28px;background:rgba(233,64,87,0.10);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;top:0;height:28px;background:rgba(233,64,87,0.10);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:28px;background:rgba(233,64,87,0.10);\"><\u002Fdiv>\n        <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:65.4px;height:65.4px;display:block;flex:none;margin:-10.9px 0 -10.9px -10.9px;\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:40px;line-height:0.9;font-weight:700;letter-spacing:-0.035em;color:#141e30;\">HydePHP<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:20px;font-size:14px;line-height:1.65;color:#3f3f4c;\">\n      <div style=\"display:flex;gap:14px;\"><div style=\"flex:none;width:22px;height:22px;border-radius:11px;background:#141e30;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;\">1<\u002Fdiv><div><strong>Cap height is the unit.<\u002Fstrong> Everything scales off the cap height of the H — call it <em>c<\u002Fem>.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;\"><div style=\"flex:none;width:22px;height:22px;border-radius:11px;background:#141e30;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;\">2<\u002Fdiv><div><strong>Hat height = 1.55c<\u002Fstrong>, measured brim-bottom to crown-top. Optically centred on the wordmark, not baseline-aligned.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;\"><div style=\"flex:none;width:22px;height:22px;border-radius:11px;background:#141e30;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;\">3<\u002Fdiv><div><strong>Gap between hat and H = 0.45c<\u002Fstrong>, measured from the widest point of the brim. Note the hat SVG carries ~17% transparent padding — subtract it when you set the gap in CSS.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;\"><div style=\"flex:none;width:22px;height:22px;border-radius:11px;background:#141e30;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;\">4<\u002Fdiv><div><strong>Clearspace = 1c on all four sides<\u002Fstrong> (the tinted band). Nothing enters it — no nav items, no button edges, no image crops.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;\"><div style=\"flex:none;width:22px;height:22px;border-radius:11px;background:#141e30;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;\">5<\u002Fdiv><div><strong>Stacked variant<\u002Fstrong> only above 24px: hat centred above, gap 0.35c, wordmark centred.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- COLOUR -->\n<div style=\"display:flex;flex-direction:column;gap:28px;padding:56px 0;border-bottom:1px solid #e4e4ea;\">\n  <div style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em;\">Colour<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:20px;\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"height:88px;border-radius:5px;background:#141e30;\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">Ink<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b6b7a;\">#141E30<\u002Fdiv><div style=\"font-size:12px;color:#8a8a99;line-height:1.5;\">Wordmark on light. Hat crown.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"height:88px;border-radius:5px;background:#ffffff;border:1px solid #dcdce4;\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">Paper<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b6b7a;\">#FFFFFF<\u002Fdiv><div style=\"font-size:12px;color:#8a8a99;line-height:1.5;\">Wordmark on dark.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"height:88px;border-radius:5px;background:#c3ccdc;\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">Mist<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b6b7a;\">#C3CCDC<\u002Fdiv><div style=\"font-size:12px;color:#8a8a99;line-height:1.5;\">“Cloud” on dark.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"height:88px;border-radius:5px;background:#5f708c;\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">Slate<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b6b7a;\">#5F708C<\u002Fdiv><div style=\"font-size:12px;color:#8a8a99;line-height:1.5;\">“Cloud” on light.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"height:88px;border-radius:5px;background:linear-gradient(90deg,#8a2387,#e94057,#f27121);\"><\u002Fdiv><div style=\"font-size:14px;font-weight:600;\">Band<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b6b7a;\">#8A2387 → #E94057 → #F27121<\u002Fdiv><div style=\"font-size:12px;color:#8a8a99;line-height:1.5;\">Hat band only. Never applied to type.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px;line-height:1.6;color:#6b6b7a;max-width:660px;text-wrap:pretty;\">One caveat carried over from the existing mark: the hat crown is Ink, so on a flat <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;\">#141E30<\u002Fspan> field the crown disappears and only the band and brim read. It works on the purple gradient the site actually uses. If you need it on flat navy, the crown needs a lighter treatment — say the word and I'll draw one.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- DON'TS -->\n<div style=\"display:flex;flex-direction:column;gap:28px;padding:56px 0;border-bottom:1px solid #e4e4ea;\">\n  <div style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em;\">Don’t<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"background:#f4f4f8;border-radius:5px;height:110px;display:flex;align-items:center;justify-content:center;gap:1.3px;\">\n        <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:45.8px;height:45.8px;\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.035em;background:linear-gradient(90deg,#8a2387,#e94057,#f27121);-webkit-background-clip:text;background-clip:text;color:transparent;\">HydePHP<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#6b6b7a;line-height:1.5;\">Don’t put the gradient in the type. It dies in one colour and at small sizes.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"background:#f4f4f8;border-radius:5px;height:110px;display:flex;align-items:center;justify-content:center;gap:1.3px;\">\n        <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:45.8px;height:45.8px;\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:0.12em;color:#141e30;\">HydePHP<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#6b6b7a;line-height:1.5;\">Don’t letterspace it open. The mark is set tight by design.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"background:#f4f4f8;border-radius:5px;height:110px;display:flex;align-items:center;justify-content:center;gap:1.3px;\">\n        <img src=\"767c90fe-03bf-4f1c-a8af-c00427c34a78\" alt=\"\" style=\"width:45.8px;height:45.8px;\">\n        <div style=\"font-size:28px;font-weight:700;letter-spacing:-0.02em;color:#141e30;\">Hyde<span style=\"font-weight:400;\">PHP<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#6b6b7a;line-height:1.5;\">Don’t split the weights, and don’t substitute the system font.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- FILES -->\n<div style=\"display:flex;flex-direction:column;gap:22px;padding:56px 0 0;\">\n  <div style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em;\">Files<\u002Fdiv>\n  <div style=\"font-size:14px;line-height:1.65;color:#4a4a58;max-width:660px;text-wrap:pretty;\">Three marks, each in a light-background and a dark-background version, in <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#f4f4f8;padding:2px 6px;border-radius:3px;\">/svg<\u002Fspan>, plus the hat on its own. Each file embeds a subsetted copy of its font — only the glyphs in the wordmark — so it renders correctly anywhere with nothing installed, while the wordmark stays live text if you need to edit it.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#e4e4ea;border:1px solid #e4e4ea;border-radius:6px;overflow:hidden;font-family:'IBM Plex Mono',monospace;font-size:13px;\">\n    <div style=\"background:#fff;padding:14px 20px;color:#141e30;\">hydephp-editorial-light.svg<\u002Fdiv>\n    <div style=\"background:#fff;padding:14px 20px;color:#141e30;\">hydephp-editorial-dark.svg<\u002Fdiv>\n    <div style=\"background:#fff;padding:14px 20px;color:#141e30;\">hydephp-grotesk-light.svg<\u002Fdiv>\n    <div style=\"background:#fff;padding:14px 20px;color:#141e30;\">hydephp-grotesk-dark.svg<\u002Fdiv>\n    <div style=\"background:#fff;padding:14px 20px;color:#141e30;\">hydephp-cloud-grotesk-light.svg<\u002Fdiv>\n    <div style=\"background:#fff;padding:14px 20px;color:#141e30;\">hydephp-cloud-grotesk-dark.svg<\u002Fdiv>\n    <div style=\"background:#fff;padding:14px 20px;color:#141e30;\">hat.svg<\u002Fdiv>\n    <div style=\"background:#fff;padding:14px 20px;color:#6b6b7a;\">README.txt<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"metrics\" style=\"position:absolute;left:-99999px;top:0;visibility:hidden;\"><\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
